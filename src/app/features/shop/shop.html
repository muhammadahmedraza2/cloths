<div class="page-wrap">
  <div class="d-flex justify-content-between align-items-center mb-3"><div><h4 class="mb-0">Kids Clothing Shop</h4><small class="text-muted">Browse products and purchase securely</small></div><a routerLink="/app/cart" class="btn btn-primary-dark"><i class="bi bi-cart3 me-1"></i> Cart</a></div>
  @if(error){<div class="alert alert-danger">{{error}}</div>}
  <div class="card erp-card mb-3"><div class="card-body"><form [formGroup]="filter" (ngSubmit)="load()" class="row g-2">
    <div class="col-lg-3"><input class="form-control" placeholder="Search product..." formControlName="search"></div>
    <div class="col-md-3 col-lg-2"><select class="form-select" formControlName="categoryId"><option value="">All Categories</option>@for(x of categories;track x.id){<option [value]="x.id">{{x.name}}</option>}</select></div>
    <div class="col-md-3 col-lg-2"><select class="form-select" formControlName="ageGroupId"><option value="">All Ages</option>@for(x of ages;track x.id){<option [value]="x.id">{{x.name}}</option>}</select></div>
    <div class="col-md-3 col-lg-2"><select class="form-select" formControlName="sizeId"><option value="">All Sizes</option>@for(x of sizes;track x.id){<option [value]="x.id">{{x.name}}</option>}</select></div>
    <div class="col-md-3 col-lg-2"><select class="form-select" formControlName="colorId"><option value="">All Colors</option>@for(x of colors;track x.id){<option [value]="x.id">{{x.name}}</option>}</select></div>
    <div class="col-md-2"><button class="btn btn-primary-dark w-100"><i class="bi bi-search"></i> Search</button></div>
  </form></div></div>
  <div class="row g-3">@for(p of products;track p.id){<div class="col-sm-6 col-lg-4 col-xl-3"><div class="card erp-card h-100 overflow-hidden">
    @if(p.images.length){<img [src]="p.images[0]" style="height:190px;object-fit:cover;width:100%" alt="">}@else{<div class="d-flex align-items-center justify-content-center bg-light" style="height:190px"><i class="bi bi-image fs-1 text-muted"></i></div>}
    <div class="card-body"><div class="small text-muted">{{p.categoryName}}</div><h6 class="mt-1">{{p.productName}}</h6><div class="fw-bold fs-5">Rs. {{p.salePrice|number}}</div><div class="small text-muted mb-2">Stock: {{p.stockQuantity}}</div>
      <button class="btn btn-primary-dark w-100" (click)="add(p)" [disabled]="p.stockQuantity<=0"><i class="bi bi-cart-plus me-1"></i>{{p.stockQuantity>0?'Add to Cart':'Out of Stock'}}</button>
    </div></div></div>} @empty{<div class="col-12 text-center text-muted py-5">No products found.</div>}</div>
</div>
