<div class="page-wrap">
  <h4 class="mb-3">Help &amp; Support</h4>
  <div class="card erp-card">
    <div class="card-body">
      <div class="accordion" id="helpAccordion">
        @for (item of faqs; track item.q; let i = $index) {
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#faq' + i">
                {{ item.q }}
              </button>
            </h2>
            <div [id]="'faq' + i" class="accordion-collapse collapse" data-bs-parent="#helpAccordion">
              <div class="accordion-body text-muted">{{ item.a }}</div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
