<div class="login-wrap d-flex align-items-center justify-content-center">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-logo mb-2">
        <i class="bi bi-bag-heart-fill"></i>
        <span class="fw-bold ms-1">Clothify</span>
      </div>
      <h5 class="mb-0">Clothing ERP</h5>
      <small class="text-muted">Sign in to continue</small>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (errorMsg) {
        <div class="alert alert-danger py-2 small">{{ errorMsg }}</div>
      }
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" formControlName="username" placeholder="Enter username" [class.is-invalid]="f.username.invalid && f.username.touched">
        </div>
        @if (f.username.invalid && f.username.touched) {
          <div class="text-danger small mt-1">Username zaroori hai.</div>
        }
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" formControlName="password" placeholder="Enter password" [class.is-invalid]="f.password.invalid && f.password.touched">
        </div>
        @if (f.password.invalid && f.password.touched) {
          <div class="text-danger small mt-1">Password zaroori hai.</div>
        }
      </div>
      <button type="submit" class="btn btn-primary-dark w-100" [disabled]="submitting">
        @if (submitting) {
          <span class="spinner-border spinner-border-sm me-2"></span> Signing in...
        } @else {
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        }
      </button>
    </form>
      <button type="button" class="btn btn-link w-100 mt-2" (click)="goRegister()">Create new customer account</button>
  </div>
</div>
