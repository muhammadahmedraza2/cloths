<div class="page-wrap">

  @if (isAdmin) {

    <!-- ================= ADMIN DASHBOARD ================= -->

    <div class="welcome-banner mb-4">
      <h2 class="mb-1">
        Welcome back, {{ userName }}
      </h2>

      <p class="mb-0 text-muted">
        Sales, Purchase, Inventory, Setup &amp; Finance — all in one place.
      </p>
    </div>

    <div class="row g-3">

      @for (card of cards; track card.formId) {

        <div class="col-6 col-md-4 col-lg-3">

          <a
            class="dash-card text-decoration-none"
            [routerLink]="['/app/FrmList', card.formId]">

            <div
              class="dash-icon"
              [class.bg-primary-subtle]="card.color === 'primary'"
              [class.text-primary]="card.color === 'primary'"
              [class.bg-success-subtle]="card.color === 'success'"
              [class.text-success]="card.color === 'success'"
              [class.bg-info-subtle]="card.color === 'info'"
              [class.text-info]="card.color === 'info'"
              [class.bg-warning-subtle]="card.color === 'warning'"
              [class.text-warning]="card.color === 'warning'"
              [class.bg-danger-subtle]="card.color === 'danger'"
              [class.text-danger]="card.color === 'danger'"
              [class.bg-secondary-subtle]="card.color === 'secondary'"
              [class.text-secondary]="card.color === 'secondary'">

              <i class="bi" [class]="card.icon"></i>

            </div>

            <div class="dash-label">
              {{ card.label }}
            </div>

          </a>

        </div>

      }

    </div>

  } @else {

    <!-- ================= CUSTOMER DASHBOARD ================= -->

    <div class="customer-dashboard">

      <!-- Customer Images / Banner -->

      <div class="customer-hero mb-4">

        <img
          src="assets/fashion.jpeg"
          alt="Clothing Collection"
          class="img-fluid w-100">

      </div>

      <!-- Customer Categories -->

      <div class="mb-4">

        <h4 class="mb-3">
          Shop by Category
        </h4>

        <div class="row g-3">

          @for (category of categories; track category.label) {

            <div class="col-6 col-md-3">

              <a
                class="shop-category-card text-decoration-none"
                [routerLink]="['/shop']">

                <img
                  [src]="category.image"
                  [alt]="category.label"
                  class="img-fluid">

                <div class="shop-category-label">
                  {{ category.label }}
                </div>

              </a>

            </div>

          }

        </div>

      </div>

      <!-- Customer Clothing Images -->

      <div class="row g-3">

        <div class="col-6 col-md-4">

          <img
            src="assets/2pieces.jpeg"
            alt="2 Piece Collection"
            class="img-fluid rounded">

        </div>

        <div class="col-6 col-md-4">

          <img
            src="assets/frok.jpeg"
            alt="Frock Collection"
            class="img-fluid rounded">

        </div>

        <div class="col-6 col-md-4">

          <img
            src="assets/lenon.jpeg"
            alt="Clothing Collection"
            class="img-fluid rounded">

        </div>

      </div>

    </div>

  }

</div>
